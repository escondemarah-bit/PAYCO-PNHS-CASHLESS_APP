.splash-mascot{position:absolute;z-index:3;right:calc(50% - 150px);top:calc(50% - 104px);width:88px;height:98px;animation:splash-mascot-enter .72s .44s cubic-bezier(.18,.8,.25,1) both,splash-float 3.2s 1.2s ease-in-out infinite}
.onboard-mascot{position:absolute;z-index:2;top:13px;right:12px;width:74px;height:84px;animation:splash-mascot-enter .65s .12s both}
/* Payment processing is a branded scene, not a blocking spinner. */
.processing-view{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 8px 45px;color:#fff}
.processing-view h1{max-width:310px;margin:10px 0 4px;font:800 25px/1.15 Manrope;color:white}.processing-view p{max-width:280px;margin:4px 0;color:#c7d2ef;font-size:12px;line-height:1.5}
.processing-scene{width:100%;max-width:300px;height:250px;margin:0 auto 12px;position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(160deg,#203a91,#101b46);isolation:isolate}
.process-track{position:absolute;left:12%;right:12%;bottom:47px;height:2px;border-radius:3px;background:linear-gradient(90deg,transparent,#a9c8ff,#ffd84d,transparent);opacity:.8}
.processing-rider{position:absolute;z-index:2;bottom:59px;left:calc(50% - 47px);width:92px;height:103px;animation:ride-wallet 1.2s ease-in-out infinite alternate}
.process-scooter{position:absolute;z-index:3;left:calc(50% - 50px);bottom:34px;width:104px;height:35px;animation:ride-wallet 1.2s ease-in-out infinite alternate}
.process-scooter:before{content:"";position:absolute;left:22px;top:2px;width:57px;height:17px;border-radius:15px 15px 8px 8px;background:#557bff;box-shadow:inset 0 2px #ffffff70,0 5px 9px #07143d55}
.process-scooter:after{content:"";position:absolute;left:67px;top:-13px;width:17px;height:27px;border:4px solid #a9c8ff;border-left:0;border-bottom:0;border-radius:0 10px 0 0;transform:rotate(-9deg)}
.process-scooter i,.process-scooter b{position:absolute;bottom:0;width:17px;height:17px;border:4px solid #ffd84d;background:#101b46;border-radius:50%}.process-scooter i{left:19px}.process-scooter b{right:16px}.process-scooter span{position:absolute;left:39px;top:5px;width:18px;height:4px;border-radius:4px;background:#ffd84d}
.process-coin{position:absolute;z-index:2;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#ffd84d;color:#14214f;font:800 13px Manrope;box-shadow:0 4px 0 #d89f23;animation:coin-hop .8s ease-in-out infinite alternate}.process-coin.c1{left:18%;bottom:70px}.process-coin.c2{right:16%;bottom:93px;animation-delay:.2s}

/* Full-height onboarding: use the screen for art and readable type, not empty margins. */
.screen:has(.onboard-shell) .view{height:calc(100% - 38px);padding:8px 20px max(16px,env(safe-area-inset-bottom));overflow-y:auto}
.onboard-shell{min-height:100%;display:grid;grid-template-rows:auto minmax(210px,1fr) auto auto;gap:clamp(8px,1.5vh,14px);padding:0 0 4px}
.onboard-shell>.login-brand-row{height:46px;min-height:46px;margin:0}

.onboard-wallet:before{left:23px;top:22px;font-size:17px}.onboard-wallet:after{right:25px;bottom:14px;font-size:52px}
.onboard-mascot{width:clamp(104px,31vw,145px);height:clamp(118px,35vw,164px);position:absolute;right:7%;bottom:9%;z-index:3;filter:drop-shadow(0 15px 14px #08123c55);animation:onboardFloat 3.8s ease-in-out infinite}
.onboard-coin.oc2{width:56px;height:56px;left:9%;bottom:15%;z-index:4;font-size:25px}
.onboard-phone{width:clamp(150px,46vw,194px);height:min(39vh,300px);border-radius:30px;transform:rotate(-7deg) translateX(-13%);box-shadow:0 24px 38px #08103f75}
.onboard-phone-top{height:25px}.onboard-qr{width:clamp(88px,27vw,116px);height:clamp(88px,27vw,116px);font-size:72px}
.onboard-chart{width:min(75%,310px);height:min(34vh,245px);position:absolute;left:8%;bottom:12%;display:flex;align-items:end;gap:clamp(9px,3vw,18px);padding:18px 17px 16px;border-radius:24px;background:linear-gradient(145deg,#ffffff20,#ffffff0c);border:1px solid #ffffff2a;box-shadow:0 20px 35px #08103f40;transform:rotate(-3deg)}
.onboard-chart i{flex:1;border-radius:13px 13px 5px 5px;background:linear-gradient(180deg,#ffe47a,#ffbd38);box-shadow:0 0 17px #ffd84d44;animation:chartRise .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n)*90ms)}
.onboard-copy h1{font:800 clamp(34px,8.7vw,43px)/1.02 Manrope,sans-serif;letter-spacing:-1.7px;margin:0;max-width:370px}
.onboard-copy p{font-size:clamp(15px,4vw,17px);color:#dbe5ff;line-height:1.42;margin:9px 0 0;max-width:360px}
.onboard-footer{display:grid;grid-template-columns:1fr;gap:9px;padding-bottom:2px}
.onboard-footer .dots{margin:0 0 2px;justify-content:center;gap:8px}.onboard-footer .dots i{width:8px;height:8px}.onboard-footer .dots i.active{width:28px}
.onboard-footer .yellow-button,.onboard-footer .soft-button{height:52px;font-size:14px;border-radius:17px;margin:0}
.onboard-footer .soft-button{background:#dce8ff;color:#173a96;border:1px solid #ffffff70;font-weight:800}
.onboard-art-label{position:absolute;z-index:4;left:18px;top:18px;padding:8px 12px;border:1px solid #ffffff35;border-radius:999px;background:#101b466b;color:#fff;font:800 10px 'DM Sans';letter-spacing:1.2px}
@keyframes onboardFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes chartRise{from{transform:scaleY(.15);transform-origin:bottom;opacity:.3}to{transform:scaleY(1);transform-origin:bottom;opacity:1}}

@media(max-height:720px){.onboard-shell{grid-template-rows:auto minmax(160px,1fr) auto auto;gap:7px}.onboard-art{min-height:160px}.onboard-footer .yellow-button,.onboard-footer .soft-button{height:45px}.login-hero{min-height:252px;padding-bottom:108px}.login-intro{margin-top:8px}.login-intro h1{font-size:29px}.login-mascot{width:105px;height:118px}.login-card{padding:11px 13px}.login-card h2{margin:9px 0 2px}.role-tabs{margin-bottom:10px}.form-field{margin-top:9px}.input{height:43px}}

case'Cashier POS':return `${pageHead('Canteen checkout')}<section class="pos-hero"><div class="micro">CASHIER · MARIA S.</div><div class="pos-total" id="cartTotal">${money(cartTotal)}</div><div class="subhello">Current sale · demo mode</div></section><div class="section-row"><h2 class="section-title">Popular today</h2><button class="text-link" data-page="Cashier reports">Sales ↗</button></div><div class="product-grid">${[['meal','Chicken rice',50],['meal','Siomai rice',35],['drink','Bottled water',15],['banana','Banana cue',20],['sandwich','Sandwich',30],['tea','Milk tea',45]].map(x=>`<button class="product-card" data-product="${x[2]}"><span class="prod-art">${illustration(x[0])}</span><b>${x[1]}</b><small>₱${x[2]} · Add +</small></button>`).join('')}</div><button class="yellow-button" data-page="Cashier checkout" style="margin-top:14px">Continue · ${money(cartTotal)}</button><button class="soft-button" data-page="Add Money">Load a student balance</button>`;
case'Cashier checkout':return `${pageHead('Review the sale')}<div class="list-card"><div class="receipt-row"><span>Cart total</span><b>${money(cartTotal)}</b></div><div class="receipt-row"><span>Student wallet</span><b>Verified · •••• 0001</b></div><div class="receipt-row"><span>Available</span><b>${money(balance)}</b></div></div><div class="section-row"><h2 class="section-title">Demo payment</h2></div><p style="font-size:11px;color:#8189a0;line-height:1.5">Verify the student and total before confirming. This prototype does not process real payments.</p><button class="yellow-button" data-page="Cashier sale complete">Confirm demo sale</button><button class="soft-button" data-page="Cashier POS">Back to cart</button>`;
case'Cashier sale complete':return `<div class="success-view" style="color:var(--navy);padding-top:26px"><div class="success-orb">✓</div><div class="micro">SALE COMPLETE · DEMO</div><h1 style="font:800 25px Manrope">Payment recorded.</h1><p style="color:#8189a0">Verified student wallet · •••• 0001</p><div class="success-amount">${money(lastSale)}</div><button class="yellow-button" data-page="Cashier POS">Start next sale</button><button class="soft-button" data-page="Cashier reports">View shift summary</button></div>`;
case'Cashier reports':return `${pageHead('Today’s sales')}<div class="admin-stat-grid"><div class="admin-stat"><small>SALES TODAY</small><b>₱8,460</b></div><div class="admin-stat"><small>TRANSACTIONS</small><b>124</b></div><div class="admin-stat"><small>AVG. SALE</small><b>₱68</b></div><div class="admin-stat"><small>BALANCE LOADED</small><b>₱2,100</b></div></div><div class="section-row"><h2 class="section-title">Popular picks</h2><span class="micro">TODAY</span></div><div class="list-card">${[['meal','Chicken rice','42 sold'],['drink','Bottled water','36 sold'],['banana','Banana cue','28 sold']].map(x=>`<div class="tx-row"><span class="tx-pic">${artIcon(x[0])}</span><div class="tx-label"><b>${x[1]}</b><small>${x[2]}</small></div><span class="chev">↗</span></div>`).join('')}</div><p style="font-size:9px;color:#969caf;margin-top:13px">Sample report data for demo presentation.</p>`;
case'Admin overview':return `${pageHead('School overview')}<div class="micro">PAGALANGGANG NHS · WED, NOV 25</div><div class="admin-stat-grid"><div class="admin-stat"><small>STUDENT ACCOUNTS</small><b>1,248</b></div><div class="admin-stat"><small>ACTIVE TODAY</small><b>986</b></div><div class="admin-stat"><small>DEMO SALES</small><b>₱8,460</b></div><div class="admin-stat"><small>TRANSACTIONS</small><b>124</b></div></div><div class="section-row"><h2 class="section-title">School activity</h2><button class="text-link" data-page="Audit log">Audit trail →</button></div><div class="list-card"><div class="tx-row"><span class="tx-pic blue">＋</span><div class="tx-label"><b>Balance load recorded</b><small>Cashier M. Santos · 10:42 AM</small></div><span class="chev">›</span></div><div class="tx-row"><span class="tx-pic">₱</span><div class="tx-label"><b>Canteen payments</b><small>124 demo transactions today</small></div><span class="chev">›</span></div></div><button class="soft-button" data-page="Accounts">Manage student & cashier accounts</button><button class="soft-button" data-page="Cashier reports">Open sales report</button>`;
case'Accounts':return `${pageHead('School accounts')}<div class="history-filters"><button class="filter-pill active">Students</button><button class="filter-pill">Cashiers</button><button class="filter-pill">Status</button></div><div class="list-card"><div class="tx-row"><span class="avatar">JDC</span><div class="tx-label"><b>Juan A. Dela Cruz</b><small>2026-001 · Grade 12 · Active</small></div><span class="chev">›</span></div><div class="tx-row"><span class="avatar" style="background:#d8e8ff">JM</span><div class="tx-label"><b>Jamie Mendoza</b><small>2026-018 · Grade 12 · Active</small></div><span class="chev">›</span></div><div class="tx-row"><span class="avatar" style="background:#dff3e9">MS</span><div class="tx-label"><b>Maria Santos</b><small>Cashier · Canteen · Active</small></div><span class="chev">›</span></div></div><button class="yellow-button" style="margin-top:14px" data-page="Help">＋ &nbsp;Register demo account</button><p style="font-size:9px;color:#969caf;text-align:center;margin-top:12px">Sample accounts · account changes are not persisted</p>`;
case'Audit log':return `${pageHead('Activity trail')}<div class="micro">RECENT DEMO EVENTS</div><div class="list-card" style="margin-top:12px">${[['10:42','Balance loaded','Cashier M. Santos · 2026-001'],['10:18','Purchase recorded','Chicken rice · ₱50'],['09:34','Student account viewed','Admin · 2026-018'],['08:02','Shift opened','Cashier M. Santos']].map(x=>`<div class="tx-row"><span class="tx-pic blue">◷</span><div class="tx-label"><b>${x[1]}</b><small>${x[2]}</small></div><span class="tx-amount">${x[0]}</span></div>`).join('')}</div><p style="font-size:9px;color:#969caf;margin-top:12px">Sample audit events for demo only.</p>`;
case'Help':return `${pageHead('A little help')}<div class="list-card"><div class="settings-item"><span class="si">?</span><span>How does PayCo work?<span style="display:block;font-size:9px;color:#8a91a7;margin-top:4px">Use your school wallet at the canteen.</span></span><span class="chev">›</span></div><div class="settings-item"><span class="si">₱</span><span>How do I add balance?<span style="display:block;font-size:9px;color:#8a91a7;margin-top:4px">Ask an authorized school cashier.</span></span><span class="chev">›</span></div><div class="settings-item"><span class="si">▦</span><span>Is this a real payment?<span style="display:block;font-size:9px;color:#8a91a7;margin-top:4px">No. This is a visual demo prototype.</span></span><span class="chev">›</span></div></div>`;
default:return `<div class="empty"><div class="success-orb">✦</div><h2>Every peso has a purpose.</h2><p>Explore your wallet, your goals, and your spending story.</p><button class="yellow-button" data-page="Home">Back to home</button></div>`}}
function render(){let routeChanged=lastRenderedPage!==null&&lastRenderedPage!==page;lastRenderedPage=page;let screen=$('#screen'),view=$('#view');screen.className='screen'+(['Insights','QR Scanner','Payment Success','Payment Processing','Category spending','Add Money'].includes(page)?' dark-screen':'');if(theme==='dark'&&!['Insights','QR Scanner','Payment Success','Payment Processing','Category spending','Add Money'].includes(page))screen.classList.add('app-dark');if(['QR Scanner','Payment Success','Payment Processing','Category spending','Add Money'].includes(page))screen.classList.add('full-bleed');view.innerHTML=page==='Home'?home():page==='Insights'?insights():page==='Goals'?goals():page==='Profile'?profile():subpage();$('#navWrap').innerHTML=nav()?`<div class="nav-wrap">${nav()}</div>`:'';let motion=$('#routeMotion');if(motion&&routeChanged){motion.classList.remove('run');void motion.offsetWidth;motion.classList.add('run');clearTimeout(routeMotionTimer);routeMotionTimer=setTimeout(()=>motion.classList.remove('run'),520)}bind();if(page==='My QR')drawQR();bindExtras();if(page==='QR Scanner')startScannerCamera();else stopScannerCamera()}

function stopScannerCamera(){if(cameraScanTimer){clearTimeout(cameraScanTimer);cameraScanTimer=0}if(activeCameraStream){activeCameraStream.getTracks().forEach(t=>t.stop());activeCameraStream=null}flashEnabled=false}
function setCameraMessage(title,help,status){const a=$('#cameraMessage'),b=$('#cameraHelp'),c=$('#cameraStatus');if(a)a.textContent=title;if(b)b.textContent=help;if(c)c.textContent=status}
async function startScannerCamera(){stopScannerCamera();const video=$('#scanVideo'),placeholder=$('#cameraPlaceholder');if(!video)return;if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setCameraMessage('Camera needs a secure page','Open PayCo from HTTPS (or localhost), then allow camera access.','Camera unavailable on this connection');return}try{activeCameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});if(page!=='QR Scanner'){stopScannerCamera();return}video.srcObject=activeCameraStream;await video.play();video.classList.add('camera-active');if(placeholder)placeholder.classList.add('camera-ready');setCameraMessage('Camera ready','Point at the cashier’s PayCo QR code.','Live camera · scanning');const track=activeCameraStream.getVideoTracks()[0];const caps=track.getCapabilities?.()||{};const flash=$('#flashToggle');if(flash){flash.disabled=!caps.torch;flash.textContent=caps.torch?'Turn on flashlight':'Flashlight unavailable'}if('BarcodeDetector'in window){try{const detector=new BarcodeDetector({formats:['qr_code']});const scan=async()=>{if(page!=='QR Scanner'||!activeCameraStream)return;try{const codes=await detector.detect(video);if(codes.length){setCameraMessage('PayCo code found','Review the amount before confirming.','QR code detected');go('Payment Confirmation');return}}catch(e){}cameraScanTimer=setTimeout(scan,450)};scan()}catch(e){setCameraMessage('Camera ready','Point at the cashier’s PayCo QR code.','Live camera · use manual entry if needed')}}}catch(error){if(activeCameraStream)stopScannerCamera();const denied=error?.name==='NotAllowedError'||error?.name==='PermissionDeniedError';const missing=error?.name==='NotFoundError';setCameraMessage(denied?'Allow camera access':missing?'No camera found':'Could not open camera',denied?'Enable camera permission in your browser settings, then try again.':missing?'This device does not have an available camera.':'Close other apps using the camera and try again.',denied?'Camera permission is off':'Use manual amount entry to continue');const note=$('#cameraNote');if(note)note.textContent='Camera preview needs browser permission. Manual amount entry remains available.'}}
function drawQR(){const q=$('#qr');if(!q)return;for(let i=0;i<169;i++){let el=document.createElement('i'),x=i%13,y=Math.floor(i/13);if(((x*7+y*11+x*y)%5)<2||((x<4&&y<4)||(x>8&&y<4)||(x<4&&y>8)))el.className='on';q.append(el)}}function go(p){if(p==='Splash'){sessionRole=''}else if(sessionRole&&['Onboarding','Login','Student Login','Cashier Login','Admin Login','Demo roles'].includes(p)){showToast('Sign out before choosing another account type.');return}else if(sessionRole&&requiresRole(p)&&!rolePages[sessionRole]?.has(p)){showToast(`This page is not available in your ${sessionRole} account.`);return}else if(!sessionRole&&requiresRole(p)){showToast('Sign in to open this area.');p='Student Login'}if(page==='Payment Confirmation'&&(p==='Payment Success'||p==='Payment Processing'))balance=Math.max(0,balance-85);if(page==='Cashier checkout'&&p==='Cashier sale complete'){lastSale=cartTotal;balance=Math.max(0,balance-cartTotal);cartTotal=0}page=p;render();if(p==='Payment Processing')setTimeout(()=>{if(page==='Payment Processing')go('Payment Success')},1300)}function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>go(page==='Receipt'?'Payment Success':page==='Payment Confirmation'?'QR Scanner':page==='Cashier checkout'?'Cashier POS':sessionRole==='Admin'?'Admin overview':sessionRole==='Cashier'?'Cashier POS':'Home'));document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{selectedPeriod=b.dataset.period;chartVals=selectedPeriod==='Daily'?[20,28,15,75,32,13,0]:selectedPeriod==='Monthly'?[38,75,52,90,66,34,12]:[42,64,35,87,53,29,0];render()});document.querySelectorAll('[data-bar]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chart-bar').forEach(x=>x.classList.remove('active'));b.classList.add('active');let i=Number(b.dataset.bar),days=['MON','TUE','WED','THU','FRI','SAT','SUN'];$('#chartBlurb').textContent=`${days[i]} · ₱${[45,70,35,88,62,20,0][i]} spent · ${i===4?'your busiest day':'a little money move'}`});let v=$('#visibility');if(v)v.onclick=()=>{hidden=!hidden;render()};let th=$('#themeToggle');if(th)th.onclick=toggleTheme;document.querySelectorAll('[data-setting="Balance visibility"]').forEach(b=>b.onclick=()=>{hidden=!hidden;go('Home')});document.querySelectorAll('[data-setting="Color theme"]').forEach(b=>b.onclick=toggleTheme)}
function toggleTheme(){theme=theme==='light'?'dark':'light';try{localStorage.setItem('payco-theme',theme)}catch(e){}render();showToast(`${theme==='dark'?'Dark':'Light'} mode enabled.`)}function bindExtras(){let mascot=$('#mascotWave');if(mascot)mascot.onclick=()=>{mascot.classList.remove('mascot-wave');void mascot.offsetWidth;mascot.classList.add('mascot-wave');let bubble=mascot.querySelector('.mascot-speech');if(bubble)bubble.textContent='Hi, Juan!';clearTimeout(mascotTimer);mascotTimer=setTimeout(()=>{mascot.classList.remove('mascot-wave');if(bubble)bubble.textContent=page==='Splash'?'Say hi!':'Tap to say hi!'},1600)};let flash=$('#flashToggle');if(flash)flash.onclick=async()=>{const track=activeCameraStream?.getVideoTracks()[0];if(!track)return;try{flashEnabled=!flashEnabled;await track.applyConstraints({advanced:[{torch:flashEnabled}]});flash.textContent=flashEnabled?'Turn off flashlight':'Turn on flashlight'}catch(e){flash.textContent='Flashlight unavailable'}};document.querySelectorAll('#directThemeToggle').forEach(b=>b.onclick=toggleTheme);document.querySelectorAll('[data-login-submit]').forEach(b=>b.onclick=()=>{let role=b.dataset.loginRole,identity=$('#loginIdentity')?.value.trim()||'',secret=$('#loginPassword')?.value.trim()||'',message=$('#authMessage');let error='';if(role==='Cashier'&&!identity)error='Enter your cashier ID.';else if(role==='Administrator'&&!identity)error='Enter your school email.';else if(role==='Student'&&!/^\d{12}$/.test(identity))error='Enter the 12-digit student LRN.';else if(role==='Student'&&!secret)error='Enter your student password or PIN.';else if(role==='Cashier'&&!secret)error='Enter your cashier security code.';else if(role==='Administrator'&&!secret)error='Enter your admin security code.';if(error){if(message)message.textContent=error;return}if(message)message.textContent='';sessionRole=role==='Administrator'?'Admin':role;go(b.dataset.loginSubmit)});let mt=$('#menuToggle'),mp=$('#quickMenu');if(mt&&mp)mt.onclick=()=>{let open=mp.hidden;mp.hidden=!open;mt.setAttribute('aria-expanded',String(open));mt.setAttribute('aria-label',open?'Close app menu':'Open app menu')};document.onclick=e=>{if(mp&&!e.target.closest('.menu-anchor')){mp.hidden=true;if(mt){mt.setAttribute('aria-expanded','false');mt.setAttribute('aria-label','Open app menu')}}};document.onkeydown=e=>{if(e.key==='Escape'&&mp&&!mp.hidden){mp.hidden=true;if(mt)mt.setAttribute('aria-expanded','false')}};document.querySelectorAll('[data-action="theme"]').forEach(b=>b.onclick=toggleTheme);document.querySelectorAll('[data-onboard-next]').forEach(b=>b.onclick=()=>{if(onboardStep<3){onboardStep++;render()}else go('Login')});document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{cartTotal+=Number(b.dataset.product);render();showToast('Added to the demo cart.')});let reveal=$('#revealPassword');if(reveal)reveal.onclick=()=>{let input=$('#loginPassword');input.type=input.type==='password'?'text':'password';reveal.textContent=input.type==='password'?'Show':'Hide'};}
function showToast(msg){let t=document.createElement('div');t.textContent=msg;t.style.cssText='position:absolute;z-index:30;left:50%;bottom:92px;transform:translateX(-50%);background:#101b46;color:white;padding:11px 15px;border-radius:14px;font-size:11px;box-shadow:0 8px 22px #0003;white-space:nowrap';$('#screen').append(t);setTimeout(()=>t.remove(),1800)}function renderWithToast(msg){render();showToast(msg)}render();
</script></body></html>
